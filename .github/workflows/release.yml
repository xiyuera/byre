name: release

# Tag push -> cross-compiled binaries, a multi-arch image, and a helm package.
#
# Only ONE forge actually builds. The other publishes the tag and nothing else.
#
# `BUILD_FORGE` (repo variable) picks the builder. Unset means github: it is the public release
# channel, it owns ghcr.io, and its job token carries packages:write. Set it to `gitea` to move the
# work to a private runner instead -- `vars.REGISTRY` then has to point at a registry that forge can
# authenticate to', because a Gitea job token has no relationship with ghcr.io.
#
# Why every step re-derives the decision instead of one gate step setting a variable: Gitea silently
# ignores step-level `if:` and still runs the step. A `$GITHUB_ENV` handoff between steps is the same
# coin -- it depends on the same mechanism. Four lines of shell per step is ugly and it is the only
# shape that is known to work on both forges.
#
# No `uses:` anywhere: a self-hosted forge must not depend on being able to reach an action registry.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GH_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
  GOPROXY: ${{ secrets.GOPROXY || 'https://proxy.golang.org,direct' }}
  # Where the image goes. Unset on GitHub means ghcr.io, authenticated by the job token. Unset
  # elsewhere means this forge has no registry wired up, and the image step skips rather than
  # failing a tag build that was otherwise fine.
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_USER: ${{ vars.REGISTRY_USER || github.actor }}
  REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || github.token }}
  # The forge that builds. The other one exits before compiling anything.
  BUILD_FORGE: ${{ vars.BUILD_FORGE || 'github' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout (tags need the tagged commit, so no --depth)
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          if [ "$forge" != "${BUILD_FORGE}" ]; then
            echo "BUILD_FORGE=${BUILD_FORGE} but this is ${forge}; not building here."
            exit 0
          fi
          host="${GITHUB_SERVER_URL#https://}"
          git clone "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git" .
          git checkout -q "${GITHUB_REF_NAME}"
          echo "at $(git rev-parse --short HEAD) ($(git describe --tags --exact-match 2>/dev/null || echo no-tag))"

      - name: ensure go
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          [ "$forge" = "${BUILD_FORGE}" ] || exit 0
          if command -v go >/dev/null 2>&1; then
            echo "go present: $(go version)"
            exit 0
          fi
          ver=$(awk '/^go /{print $2; exit}' go.mod)
          echo "installing go ${ver}"
          curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -xzf /tmp/go.tgz -C /tmp
          echo "/tmp/go/bin" >> "$GITHUB_PATH"
          /tmp/go/bin/go version

      - name: build linux binaries
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          [ "$forge" = "${BUILD_FORGE}" ] || exit 0
          tag="${GITHUB_REF_NAME}"
          commit=$(git rev-parse --short HEAD)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # The stamp lives in internal/version, not in main: `-X main.version` compiles fine and
          # does nothing, which is how v0.4.0 shipped a binary and an image that both reported
          # "dev (none, unknown)". Keep these three paths in step with Makefile's LDFLAGS.
          ldflags="-s -w \
            -X byre/internal/version.Version=${tag} \
            -X byre/internal/version.Commit=${commit} \
            -X byre/internal/version.BuildDate=${build_date}"
          mkdir -p dist
          native=$(go env GOARCH)
          for arch in amd64 arm64; do
            out="dist/byre-${tag}-linux-${arch}"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/byre
            # Only smoke-run what this host can execute. The runner is arm64; the amd64
            # artifact dies with "Exec format error" (exit 126) and takes the job with it.
            if [ "$arch" = "$native" ]; then
              got=$(./"$out" --version)
              echo "  $(basename "$out"): $got"
              # Assert rather than print: a silent -X on a variable that does not exist is exactly
              # the failure this step is here to catch.
              case "$got" in
                "${tag} (${commit},"*) ;;
                *) echo "  FAIL: version stamp is '$got', want '${tag} (${commit}, ...)'"; exit 1 ;;
              esac
            else
              echo "  $(basename "$out"): cross-built for ${arch}, not executed here (native=${native})"
            fi
          done

      - name: package helm chart
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          [ "$forge" = "${BUILD_FORGE}" ] || exit 0
          tag="${GITHUB_REF_NAME}"
          helm_ver=v3.16.4
          if ! command -v helm >/dev/null 2>&1; then
            arch=$(go env GOARCH)
            echo "installing helm ${helm_ver} for ${arch}"
            curl -fsSL "https://get.helm.sh/helm-${helm_ver}-linux-${arch}.tar.gz" -o /tmp/helm.tgz
            tar -xzf /tmp/helm.tgz -C /tmp
            echo "/tmp/linux-${arch}" >> "$GITHUB_PATH"
            HELM="/tmp/linux-${arch}/helm"
          else
            HELM=helm
          fi
          # The chart carries its own version, which is not the release tag. Override just for this
          # build so the packaged chart and the tag cannot drift apart.
          chart_ver="${tag#v}"
          "$HELM" lint charts/byre
          "$HELM" package charts/byre --version "$chart_ver" --app-version "$tag" -d dist
          ls -l dist/*.tgz
          # A packaged chart that does not carry the tag is a silent version skew between the
          # image and the chart that installs it -- the same class of bug as an unstamped binary.
          got=$(tar -xzOf "dist/byre-${chart_ver}.tgz" byre/Chart.yaml | awk '/^version:/{print $2}')
          echo "packaged chart version: $got"
          [ "$got" = "$chart_ver" ] || { echo "FAIL: chart version is '$got', want '$chart_ver'"; exit 1; }

      - name: checksums
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          [ "$forge" = "${BUILD_FORGE}" ] || exit 0
          cd dist && sha256sum byre-* > SHA256SUMS && cat SHA256SUMS

      - name: build and push image
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          [ "$forge" = "${BUILD_FORGE}" ] || exit 0
          tag="${GITHUB_REF_NAME}"
          # Registry resolution. GitHub needs no configuration: an unset vars.REGISTRY means
          # ghcr.io and the job token authenticates it. Elsewhere an unset value means no registry
          # is wired up for this forge, so skip publishing rather than fail.
          if [ -z "$REGISTRY" ]; then
            if [ "${GITHUB_SERVER_URL}" = "https://github.com" ]; then
              REGISTRY=ghcr.io
              echo "vars.REGISTRY unset on GitHub; publishing to ghcr.io"
            else
              echo "vars.REGISTRY unset on ${GITHUB_SERVER_URL}; skipping image publish for this forge"
              exit 0
            fi
          fi
          ref="${REGISTRY}/${GITHUB_REPOSITORY,,}:${tag}"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "${REGISTRY_USER:-x}" --password-stdin
          docker buildx create --use --name byre-builder >/dev/null 2>&1 || true
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${tag}" \
            --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${tag}" \
            -t "$ref" --push .
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image ${ref}@${digest}"
          printf 'IMAGE_REF=%s\nIMAGE_DIGEST=%s\n' "$ref" "$digest" >> dist/images.txt
          # Read the stamp back out of the image just built. Building an empty ARG list produces
          # an image that reports "dev (none, unknown)" while every step succeeds, so the check
          # has to look at the artifact, not at the build log.
          native_arch=$(go env GOARCH)
          got=$(docker run --rm --platform "linux/${native_arch}" "$ref" --version 2>&1 | tail -1)
          echo "image reports: $got"
          case "$got" in
            "${tag} ("*) ;;
            *) echo "FAIL: image version stamp is '$got', want '${tag} (...)'"; exit 1 ;;
          esac
          cat dist/images.txt

      - name: attach release assets (github)
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          [ "$forge" = "${BUILD_FORGE}" ] || exit 0
          if [ "${GITHUB_SERVER_URL}" != "https://github.com" ]; then
            echo "BUILD_FORGE is gitea but this is github; skipping"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          awk -v t="$tag" '
            $0 ~ "^## \\[" substr(t,2) "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG section for $tag" >&2; exit 1; }
          gh release create "$tag" dist/* --title "$tag" --notes-file notes.md --verify-tag

      - name: attach release assets (gitea)
        run: |
          forge=github
          [ "${GITHUB_SERVER_URL}" = "https://github.com" ] || forge=gitea
          [ "$forge" = "${BUILD_FORGE}" ] || exit 0
          if [ "${GITHUB_SERVER_URL}" = "https://github.com" ]; then
            echo "this is github; handled by the previous step"
            exit 0
          fi
          # Gitea's `tea` CLI is not guaranteed on a job pod, so the release is created through the
          # REST API with the job token instead of a CLI.
          tag="${GITHUB_REF_NAME}"
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          existing=$(curl -sS -H "Authorization: token ${GH_TOKEN}" "${api}/releases/tags/${tag}")
          if echo "$existing" | grep -q '"id"'; then
            echo "release ${tag} already exists; leaving it alone"; exit 0
          fi
          curl -sS -X POST "${api}/releases" \
            -H "Authorization: token ${GH_TOKEN}" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${tag}\",\"name\":\"${tag}\",\"body\":\"See CHANGELOG.md\"}" >/dev/null
          echo "release ${tag} created; uploading assets"
          for f in dist/*; do
            name=$(basename "$f")
            curl -sS -X POST "${api}/releases/tags/${tag}/assets?name=${name}" \
              -H "Authorization: token ${GH_TOKEN}" \
              -F "attachment=@${f}" >/dev/null
            echo "  uploaded ${name}"
          done

