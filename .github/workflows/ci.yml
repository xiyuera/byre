name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This file runs unchanged on Gitea and GitHub.
#
# Two things differ between the forges and are handled below rather than by forking the file:
#   - the job token: Gitea injects `secrets.GITEA_TOKEN`, GitHub injects `github.token`
#   - the toolchain: the Gitea runner's job image already carries Go, GitHub's does not
#
# Deliberately no `uses:` at all. Every JS action would have to be fetched from github.com by
# the runner, which is the one thing a self-hosted CI must not depend on.

env:
  GH_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
  # proxy.golang.org is unreachable from the Gitea runner; the same modules come from the
  # mirror named here. `|| default` matters: an empty GOPROXY means "off" to the go tool, not
  # "use the default".
  GOPROXY: ${{ secrets.GOPROXY || 'https://proxy.golang.org,direct' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: detect scope
        run: |
          # A docs-only pull request does not need the full Go suite, but `ci / test (pull_request)`
          # is a required status check: skipping the *job* leaves the check "Expected" and the PR
          # can never merge. So the job always runs and always reports green; it exits early instead.
          #
          # Gitea ignores step-level `if:`, so this cannot be expressed declaratively -- hence a
          # marker file that the following steps read. Push events always run the full suite: that
          # is the last gate before a release, and "nothing changed" is not a thing a push to a
          # branch can assert.
          if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]; then
            echo 1 > /tmp/ci_full
            echo "not a pull_request; running the full suite"
            exit 0
          fi
          host="${GITHUB_SERVER_URL#https://}"
          work=$(mktemp -d)
          cd "$work"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          # Both refs in ONE fetch, with no --depth. Two independent shallow fetches each get their own
          # shallow boundary, so the two commits have no common ancestor, `git diff` returns an empty
          # list, and the guard below reads that as "nothing changed". Not theoretical: the first version
          # of this step did exactly that and reported "empty diff" for a PR that touched two workflow
          # files. It fell through to the full suite only because of that guard -- the optimisation would
          # have silently never fired.
          git fetch -q origin "refs/heads/${GITHUB_BASE_REF}:refs/base" "${GITHUB_SHA}:refs/pr" \
            || { echo 1 > /tmp/ci_full; echo "fetch failed; running the full suite"; exit 0; }
          base=$(git rev-parse refs/base)
          changed=$(git diff --name-only "$base" refs/pr)
          if [ -z "$changed" ]; then
            echo 1 > /tmp/ci_full
            echo "empty diff; running the full suite rather than guessing"
            exit 0
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo 1 > /tmp/ci_full
            echo "code changed; full suite"
          else
            echo 0 > /tmp/ci_full
            echo "docs-only; the Go suite is skipped (job still reports green, because it is required)"
          fi
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          [ "$(cat /tmp/ci_full 2>/dev/null || echo 1)" = "1" ] || { echo "docs-only; skipping checkout"; exit 0; }
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # Gitea ignores step-level `if:` AND still executes any `uses:`, so a JS action cannot be
      # made conditional. The job image ships Go on Gitea; GitHub's runner does not. Installed
      # in shell so both forges take the same path.
      - name: ensure go
        run: |
          [ "$(cat /tmp/ci_full 2>/dev/null || echo 1)" = "1" ] || { echo "docs-only; skipping go install"; exit 0; }
          if command -v go >/dev/null 2>&1; then
            echo "go present: $(go version)"
            exit 0
          fi
          ver=$(awk '/^go /{print $2; exit}' go.mod)
          echo "installing go ${ver}"
          curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -xzf /tmp/go.tgz -C /tmp
          echo "/tmp/go/bin" >> "$GITHUB_PATH"
          /tmp/go/bin/go version
      - name: go vet
        run: |
          [ "$(cat /tmp/ci_full 2>/dev/null || echo 1)" = "1" ] || { echo "docs-only; skipping vet"; exit 0; }
          go vet ./...
      - name: tests
        run: |
          [ "$(cat /tmp/ci_full 2>/dev/null || echo 1)" = "1" ] || { echo "docs-only; skipping tests"; exit 0; }
          go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # Gitea ignores step-level `if:` AND still executes any `uses:`, so a JS action cannot be
      # made conditional. The job image ships Go on Gitea; GitHub's runner does not. Installed
      # in shell so both forges take the same path.
      - name: ensure go
        run: |
          if command -v go >/dev/null 2>&1; then
            echo "go present: $(go version)"
            exit 0
          fi
          ver=$(awk '/^go /{print $2; exit}' go.mod)
          echo "installing go ${ver}"
          curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -xzf /tmp/go.tgz -C /tmp
          echo "/tmp/go/bin" >> "$GITHUB_PATH"
          /tmp/go/bin/go version
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: docs links
        # `mkdocs build --strict` fails a link to a missing *file*; it says nothing about the
        # *fragment*. `operations.md#rotation` built green for months while landing readers at the
        # top of the page, because the target had no such heading. This builds each file's anchor
        # set the way python-markdown slugs headings and checks every in-site fragment.
        run: python3 scripts/check-doc-links.py
      - name: docs build
        # `docs.yml` carries `if: github.server_url == 'https://github.com'` because GitHub has Pages
        # and Gitea does not, so `--strict` has never run on a pull request: a broken link could merge
        # green and only surface as a failed *deploy* after the mirror pushed to GitHub. Building here
        # puts it where the review happens. Cheap — the site is ~50 pages and takes under three seconds
        # once the theme is installed.
        run: |
          python3 -m pip install --quiet "mkdocs==1.6.1" "mkdocs-material==9.8.2" "mkdocs-static-i18n==1.3.1"
          mkdocs build --strict --clean

  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: bilingual docs in sync
        run: sh scripts/check-i18n.sh

  # Renders deploy/ and the Helm chart, so a broken kustomization or template is caught before a
  # cluster sees it. `make render` fails rather than skipping when no engine is installed — a check
  # that silently skips reports success without having checked anything. Both tools are installed
  # explicitly below because neither is on ubuntu-latest.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # helm is not on ubuntu-latest, and the chart is a published artifact -- `helm lint` +
      # `helm template` is the only thing between a broken helper function and a user's
      # `helm install`. Sources are ones this runner can reach; the arch branch keeps it working
      # on an arm64 runner too.
      - name: Install kubectl and helm
        run: |
          set -eu
          arch=$(uname -m)
          case "$arch" in
            aarch64|arm64) a=arm64 ;;
            *) a=amd64 ;;
          esac
          mkdir -p /tmp/tools
          curl -sSL --retry 3 -m 180 -o /tmp/tools/kubectl \
            "https://dl.k8s.io/release/v1.31.4/bin/linux/${a}/kubectl"
          chmod +x /tmp/tools/kubectl
          curl -sSL --retry 3 -m 180 \
            "https://mirrors.huaweicloud.com/helm/v3.16.3/helm-v3.16.3-linux-${a}.tar.gz" \
            | tar xz -C /tmp/tools
          /tmp/tools/kubectl version --client
          /tmp/tools/linux-${a}/helm version --short
      - name: Validate manifests and chart
        run: |
          set -eu
          arch=$(uname -m)
          case "$arch" in
            aarch64|arm64) a=arm64 ;;
            *) a=amd64 ;;
          esac
          export PATH="/tmp/tools/linux-${a}:/tmp/tools:$PATH"
          make render
          make chart HELM="/tmp/tools/linux-${a}/helm"

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: checkout with history
        run: |
          # dco needs the merge base, so fetch the branch tip with full history and check out
          # the PR commit on top of it.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: every commit in the PR carries Signed-off-by
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          missing=$(git log --format='%H %s' "$base..HEAD" | while read -r sha _; do
            git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: ' || echo "$sha"
          done)
          if [ -n "$missing" ]; then
            echo "commits without Signed-off-by:"; echo "$missing"; exit 1
          fi
