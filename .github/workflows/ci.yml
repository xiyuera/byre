name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This file runs unchanged on Gitea and GitHub.
#
# Two things differ between the forges and are handled below rather than by forking the file:
#   - the job token: Gitea injects `secrets.GITEA_TOKEN`, GitHub injects `github.token`
#   - the toolchain: the Gitea runner's job image already carries Go, GitHub's does not
#
# Deliberately no `uses:` at all. Every JS action would have to be fetched from github.com by
# the runner, which is the one thing a self-hosted CI must not depend on.

env:
  GH_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
  # proxy.golang.org is unreachable from the Gitea runner; the same modules come from the
  # mirror named here. `|| default` matters: an empty GOPROXY means "off" to the go tool, not
  # "use the default".
  GOPROXY: ${{ secrets.GOPROXY || 'https://proxy.golang.org,direct' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # Gitea ignores step-level `if:` AND still executes any `uses:`, so a JS action cannot be
      # made conditional. The job image ships Go on Gitea; GitHub's runner does not. Installed
      # in shell so both forges take the same path.
      - name: ensure go
        run: |
          if command -v go >/dev/null 2>&1; then
            echo "go present: $(go version)"
            exit 0
          fi
          ver=$(awk '/^go /{print $2; exit}' go.mod)
          echo "installing go ${ver}"
          curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -xzf /tmp/go.tgz -C /tmp
          echo "/tmp/go/bin" >> "$GITHUB_PATH"
          /tmp/go/bin/go version
      - name: go vet
        run: go vet ./...
      - name: tests
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # Gitea ignores step-level `if:` AND still executes any `uses:`, so a JS action cannot be
      # made conditional. The job image ships Go on Gitea; GitHub's runner does not. Installed
      # in shell so both forges take the same path.
      - name: ensure go
        run: |
          if command -v go >/dev/null 2>&1; then
            echo "go present: $(go version)"
            exit 0
          fi
          ver=$(awk '/^go /{print $2; exit}' go.mod)
          echo "installing go ${ver}"
          curl -fsSL "https://go.dev/dl/go${ver}.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -xzf /tmp/go.tgz -C /tmp
          echo "/tmp/go/bin" >> "$GITHUB_PATH"
          /tmp/go/bin/go version
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: bilingual docs in sync
        run: sh scripts/check-i18n.sh

  # Renders deploy/ with the same engine `kubectl apply -k` uses, so a broken kustomization
  # is caught before a cluster sees it. `make render` degrades to a warning when kustomize is
  # absent -- the Gitea job image ships it, GitHub's runner does not, and that is acceptable:
  # the check runs for real on whichever side has the tool.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: |
          # `git clone` alone lands on the default branch, so a pull_request run would test
          # main instead of the PR. Fetch the exact commit by sha: GITHUB_SHA is set by both
          # forges and is a commit, not a ref.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Validate kustomize output
        run: make render

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: checkout with history
        run: |
          # dco needs the merge base, so fetch the branch tip with full history and check out
          # the PR commit on top of it.
          host="${GITHUB_SERVER_URL#https://}"
          git init -q .
          git remote add origin "https://x:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: every commit in the PR carries Signed-off-by
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          missing=$(git log --format='%H %s' "$base..HEAD" | while read -r sha _; do
            git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: ' || echo "$sha"
          done)
          if [ -n "$missing" ]; then
            echo "commits without Signed-off-by:"; echo "$missing"; exit 1
          fi
