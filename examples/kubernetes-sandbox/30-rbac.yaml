# What the gateway is allowed to do, and nothing more.
#
# byre's `claims` provisioner creates one SandboxClaim per identity, reads its status for the
# endpoint, and deletes it when the lease expires. It never touches the template or the pool:
# those are operator-owned objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: byre
  namespace: byre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: byre-claims
  namespace: byre
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: byre-claims
  namespace: byre
subjects:
  - kind: ServiceAccount
    name: byre
    namespace: byre
roleRef:
  kind: Role
  name: byre-claims
  apiGroup: rbac.authorization.k8s.io
