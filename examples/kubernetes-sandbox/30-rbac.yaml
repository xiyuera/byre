# What the gateway is allowed to do, and nothing more.
#
# byre's `claims` provisioner creates one SandboxClaim per identity, reads its status for the
# endpoint, and deletes it when the lease expires. It never touches the template or the pool:
# those are operator-owned objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: byre
  namespace: byre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: byre-claims
  namespace: byre
rules:
  # The lease table. Separate group from the sandbox API because it is byre's own CRD, and a
  # gateway without these verbs cannot list its own leases: it degrades to reading identity off the
  # instance annotation and looks healthy while holding none.
  - apiGroups: ["byre.io"]
    resources: ["byreleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["byre.io"]
    resources: ["byreleases/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: byre-claims
  namespace: byre
subjects:
  - kind: ServiceAccount
    name: byre
    namespace: byre
roleRef:
  kind: Role
  name: byre-claims
  apiGroup: rbac.authorization.k8s.io
