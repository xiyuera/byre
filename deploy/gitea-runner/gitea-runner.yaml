# Gitea runner in job-pods mode: one pod per job, no Docker daemon, no privileged container.
#
# The runner lives beside the gateway (single-namespace discipline). Job pods are created in this same
# namespace with the runner's ServiceAccount, which is why the Role below is narrow and local: pods,
# pods/exec, pods/log, secrets. Nothing cluster-wide beyond the pod's own token.
---
# Where job pods may land and what they may consume. This file is only read because the Deployment sets
# CONFIG_FILE: the image's entrypoint passes that value as `-c`, and without it every setting here is
# silently ignored — pods still start, they just ignore the scheduler policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: hermes
data:
  config.yaml: |
    kubernetes:
      pod_template:
        spec:
          # A preference, not a pin: the CI host is the machine with the cores, but when it is full the
          # job should spill rather than queue forever. Set nodeSelector instead to make it a hard rule.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["__NODE_NAME__"]
          containers:
            # The name "job" is the runner's convention: this container merges into the job container.
            - name: job
              resources:
                requests: {cpu: "1", memory: 1Gi}
                limits: {memory: 8Gi} # unbounded, a race-instrumented build can eat a whole node
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-runner
  namespace: hermes
rules:
  # Job pods: created per job, deleted when it ends. exec and log are how the runner streams steps.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
  # The runner parks per-job state in a Secret it owns.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-runner
  namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-runner
subjects:
  - kind: ServiceAccount
    name: gitea-runner
    namespace: hermes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-data
  namespace: hermes
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: hermes
  labels:
    app.kubernetes.io/name: gitea-runner
spec:
  replicas: 1
  strategy:
    type: Recreate # the registration file on the PVC must never be written by two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
    spec:
      serviceAccountName: gitea-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Pinned by digest: a moved tag plus IfNotPresent keeps running the old binary (docs/operations.md).
          image: <internal-registry-host>:<port>/gitea/runner@sha256:b058623fefa8cbf635a3852554bb1e3493aa753fd98a9b87f00b3b3774f2d23d
          env:
            - name: GITEA_INSTANCE_URL
              value: https://<your-gitea-host>:<port>
            # The instance uses a private CA; this certificate is the trust anchor for the runner's own
            # API calls and for the job pods it creates.
            - name: SSL_CERT_FILE
              value: /etc/ssl/custom/ca.crt
            - name: GITEA_RUNNER_NAME
              value: k3s-jobpods
            # Without this the entrypoint never passes `-c`, and the config.yaml above is dead weight.
            - name: CONFIG_FILE
              value: /data/config.yaml
            - name: HOME
              value: /data
            # Label format is "<name>:<schema>://<image>"; the name is what a workflow's runs-on selects.
            # No docker:// label on purpose: this runner has no daemon. The job image comes from the
            # private registry because the nodes have no Docker Hub route.
            - name: GITEA_RUNNER_LABELS
              value: k8s-go:kubernetes://<internal-registry-host>:<port>/library/ci-go:1.23
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ca
              mountPath: /etc/ssl/custom
              readOnly: true
            # subPath, so the registration file the runner writes at /data/.runner is not shadowed.
            - name: config
              mountPath: /data/config.yaml
              subPath: config.yaml
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-runner-data
        - name: ca
          configMap:
            name: gitea-instance-ca
        - name: config
          configMap:
            name: gitea-runner-config
