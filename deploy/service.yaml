apiVersion: v1
kind: Service
metadata:
  name: keypod
  labels:
    app.kubernetes.io/name: keypod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keypod
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      protocol: TCP
    - name: health
      port: 8099
      targetPort: health
      protocol: TCP
