# Example only — never commit a real key.
#
# Create the real object out of band:
#   kubectl -n <namespace> create secret generic byre-pool-key --from-file=id_key=/path/to/key
#
# The key is the gateway's own credentials for reaching instances. It is mounted read-only at
# /etc/byre/keys/id_key (see deployment.yaml) and referenced by backends[].ssh.private_key.
apiVersion: v1
kind: Secret
metadata:
  name: byre-pool-key
  labels:
    app.kubernetes.io/name: byre
type: Opaque
stringData:
  id_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <redacted>
    -----END OPENSSH PRIVATE KEY-----
