# byre configuration — copy, then replace every <placeholder>.
#
# `byre -check-config -config <this file>` passes even with the placeholders still in place: it checks
# the shape of the file (base64 keys, host:port endpoints, a known provision), not whether you edited it.
#
# A backend answers one question: "how does an instance come into existence, and how do I reach it over
# SSH?" Four answers are supported, and none of them names a product:
#
#   endpoints   no provisioning at all: a fixed set of hosts that already exist
#   workloads   we create the workload ourselves from an image that runs sshd
#   claims      a controller hands one over when asked (any declarative claim API: a warm pool, a
#               template, a custom CRD) — which CRD is configuration, never code
#   command     an external program provisions and describes the instance (cloud, Incus, a CMDB)
#
# The live example below is `endpoints`, the only one that needs neither a cluster nor a controller;
# the other three follow it, commented out. Everything below the provision block — ssh user, key,
# host-key policy — is shared by all four.

listen: ":2222"

# SSH host key clients pin. **Required** — validation rejects a config without it, because every restart
# would otherwise change the fingerprint and every strict client would stop connecting (ADR-0006).
# Point it at durable storage: the gateway creates the key on first start if the file is absent, and
# reuses it afterwards. `-allow-ephemeral-hostkey` is the command-line escape hatch for tests only.
host_key: /var/lib/byre/hostkey/id_ed25519

lease:
  # Must exceed the client's idle timeout (the reference client idles out at 300s).
  ttl: 360s
  # Reconnect window after a disconnect; absorbs ControlMaster/ControlPersist expiry.
  grace: 60s
  # Where the lease table lives. `crd` keeps one ByreLease per identity in the namespace below, so
  # leases survive a restart and `kubectl get byl` shows who holds what; `memory` keeps them in the
  # process and is only right for a single throwaway gateway. The CRD must exist first -- the
  # kustomization applies it, but an install that only takes this file needs
  # `kubectl apply -f crd/byreleases.yaml` beforehand.
  store: crd
  namespace: byre-system
  # Warm instances kept ready. Each idle instance costs one pod-worth of memory, or whatever the
  # provisioner's idle cost is. An explicit 0 disables warm capacity — instances are created on demand,
  # which is what a first smoke test wants — and the pool only applies to backends that implement
  # Create (endpoints and command warm nothing).
  pool_size: 2

backends:
  # ---------------------------------------------------------------- 1. hosts that already exist
  # No provisioning, no adoption: these are shared or long-lived machines, and the lease only decides
  # who gets which one. Host keys are stable here, so `strict` is the right policy.
  # The port belongs to each entry; no driver reads ssh.port.
  - name: lab
    provision: endpoints
    endpoints: ["192.0.2.11:22", "192.0.2.12:22"]
    ssh:
      user: "<remote-user>"
      private_key: /etc/byre/keys/id_key
      host_key_policy: strict

  # ---------------------------------------------------------------- 2. any image that runs sshd
  # - name: adhoc
  #   provision: workloads
  #   namespace: "<namespace>"
  #   provider:
  #     image: "<registry>/<image>:<tag>"
  #     start_command: ["/usr/sbin/sshd", "-D", "-e"]   # optional override of the entrypoint
  #     ready_timeout: 180s
  #     # Instances run as non-root with all capabilities dropped and RuntimeDefault seccomp unless this
  #     # is true. Set it only for an image whose entrypoint genuinely cannot run unprivileged.
  #     run_as_root: false
  #   ssh:
  #     user: "<remote-user>"
  #     private_key: /etc/byre/keys/id_key
  #     host_key_policy: accept-new

  # ---------------------------------------------------------------- 3. a controller hands one over
  # - name: pooled
  #   provision: claims
  #   namespace: "<namespace>"
  #   kubeconfig: ""                  # empty = in-cluster service account
  #   provider:
  #     # Selectors. At least one of template/warm_pool is required, because claim APIs differ: some
  #     # instantiate a named template, some only claim from a pool.
  #     template: "<template-name>"
  #     warm_pool: "<warm-pool-name>"  # optional
  #     # The API coordinates. Nothing is built in: the same binary drives any claim-shaped API.
  #     api_group: "<api-group>"
  #     api_version: "<api-version>"
  #     resource: "<plural-resource>"
  #     object_kind: "<Kind>"           # sent verbatim, never guessed from the resource name
  #     endpoint_field: ["status", "sandbox", "serviceFQDN"]
  #     ready_timeout: 120s
  #   ssh:
  #     user: "<remote-user>"
  #     private_key: /etc/byre/keys/id_key
  #     host_key_policy: accept-new     # instances are disposable; their identity is not ours to pin

  # ---------------------------------------------------------------- 4. anything else, via a program
  # The provisioner prints one JSON object; `user`/`private_key` may be omitted and fall back to the
  # ssh block below. `list` exists to adopt: an instance is adopted when its record carries
  # `annotations.byre.io/identity`, and one that does not is kept and logged, never destroyed — a
  # restarted gateway may not guess (ADR-0009). Without `list` a restart adopts nothing at all.
  # - name: cloud
  #   provision: command
  #   command:
  #     # BYRE_IDENTITY (the client fingerprint) is in the environment.
  #     acquire: ["/usr/local/bin/provision-ci-vm"]
  #     # BYRE_INSTANCE_ID and BYRE_INSTANCE_ADDR are in the environment.
  #     release: ["/usr/local/bin/destroy-ci-vm"]
  #     # A restart can only adopt what it can attribute: print
  #     #   "annotations":{"byre.io/identity":"<fingerprint>"}
  #     # in both the acquire answer and every list entry (ADR-0009).
  #     list:    ["/usr/local/bin/list-ci-vms"]   # optional: [{id,addr,user?,private_key?,annotations?}, ...]
  #     timeout: 120s
  #     env: ["CLOUD_PROFILE=ci"]
  #   ssh:
  #     user: "<remote-user>"
  #     private_key: /etc/byre/keys/id_key
  #     host_key_policy: accept-new

identities:
  # Fingerprints of the client public keys allowed in. Print one with:
  #   ssh-keygen -lf id_ed25519.pub -E sha256
  # Two spellings of the same key are the same identity ("SHA256:" and padding are normalised away).
  # The body below is 32 zero bytes: syntactically valid, deliberately nobody's key. Replace it.
  - fingerprint: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    backend: lab
    aliases: ["<label-for-logs>"]
