# RBAC for the namespace where instances are created.
# If backend.namespace differs from the release namespace, apply this Role/RoleBinding there as well.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: byre
  labels:
    app.kubernetes.io/name: byre
rules:
  # declarative claim APIs (provision: claims)
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    # patch is required: a pooled instance is bound to its identity by patching annotations.
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "patch"]
  # bare pods (provision: workloads)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # endpoint resolution for pods/claims
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # annotation-based adoption
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
  # The lease table itself (ADR-0013). The binding lives in a CR so that a restart and a second
  # replica read the same truth instead of each process keeping its own copy. Missing verbs here
  # surface as a named startup error ("not allowed to list byreleases"), not as a silent
  # degradation -- see internal/lease/crd.Store.Ready.
  - apiGroups: ["byre.io"]
    resources: ["byreleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["byre.io"]
    resources: ["byreleases/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: byre
  labels:
    app.kubernetes.io/name: byre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: byre
subjects:
  - kind: ServiceAccount
    name: byre
    # Explicit, because this file is meant to be applied to the namespace holding the instances, which is
    # not necessarily the one byre runs in. Without it, applying to `hermes` binds `hermes:byre` -- a
    # service account that does not exist -- and the Role is created, the binding looks right, and every
    # permission silently does nothing while SubjectAccessReview answers "no".
    namespace: byre-system
