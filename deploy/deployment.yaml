apiVersion: apps/v1
kind: Deployment
metadata:
  name: byre
  labels:
    app.kubernetes.io/name: byre
spec:
  replicas: 1 # single replica by design (docs/roadmap.md: multi-replica is v0.3)
  selector:
    matchLabels:
      app.kubernetes.io/name: byre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byre
      annotations:
        # keep a rollout from killing live sessions abruptly: the manager adopts instances on start
        kubectl.kubernetes.io/default-container: byre
    spec:
      serviceAccountName: byre
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret/ConfigMap volumes are root-owned with a restrictive mode; fsGroup makes the projected
        # files readable by the non-root user, which otherwise fails with "permission denied" on the key.
        fsGroup: 10001  # must match USER in the image, or the 0400 Secret mount is unreadable
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: byre
          image: byre
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/byre/config.yaml"]
          env:
            # accept-new host keys are appended under $HOME; the root filesystem is read-only here, so
            # HOME points at an emptyDir mounted below.
            - name: HOME
              value: /home/byre
          ports:
            - name: ssh
              containerPort: 2222
            - name: health
              containerPort: 8099
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/byre
              readOnly: true
            - name: pool-key
              mountPath: /etc/byre/keys
              readOnly: true
            - name: home
              mountPath: /home/byre
            - name: host-key
              mountPath: /var/lib/byre/hostkey
      volumes:
        - name: config
          configMap:
            name: byre-config
        - name: pool-key
          secret:
            secretName: byre-pool-key
            defaultMode: 0400
        - name: home
          emptyDir: {}
        - name: host-key
          persistentVolumeClaim:
            claimName: byre-hostkey
