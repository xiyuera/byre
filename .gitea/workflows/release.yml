name: release
on:
  push:
    tags: ["v*"]

# Same rule as ci.yml: a tag is normally pushed once, so this changes nothing in the common case, but a
# release that is withdrawn and re-tagged should not leave the withdrawn build queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# What this workflow is for: turn one tag into four assets that a stranger can rebuild byte for byte.
# The build itself lives in `make dist`, so the same command works on a laptop; this file only supplies
# the inputs (tag, commit, commit date, toolchain) and publishes the result.
#
# Three things used to make that impossible, all fixed here:
#   * `date -u` was evaluated inside the per-architecture loop, so arm64 and amd64 were stamped two
#     seconds apart. The date is now the commit date, computed once and shared.
#   * build-info.txt did not record the date, the flags or the per-asset GOOS/GOARCH, so the four assets
#     could not be turned back into the binary. It records all of them now (`make dist` writes it).
#   * the job image's Go was never named, so nothing connected an asset to the compiler that made it.
#     The toolchain is pinned below and asserted against the image at build time.
jobs:
  build:
    runs-on: k8s-go
    env:
      # The runner label k8s-go binds this job to this image; the pin lives in the cluster, the
      # fingerprint lives here. Addresses stay out of the repository: these strings are what
      # build-info.txt records, and they are enough to identify the toolchain.
      CI_IMAGE: library/ci-go:1.23
      CI_IMAGE_DIGEST: sha256:40663a893f1b1be63da5cbc350dc55c175b71f95267e83214db5756ec322f528
      CI_GO_VERSION: go1.23.12
    steps:
      # Not actions/checkout: that action is JavaScript, and the job image has no Node and no route to
      # the action host. Same reason (and same shape) as ci.yml, where the runner rejects builtin:checkout.
      - name: Checkout, with the tag and the history it points into
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.sslVerify=false -c http.extraheader="Authorization: token ${{ github.token }}" \
            fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout -q "${GITHUB_SHA}"
          git describe --tags --exact-match

      # A rebuilt asset that differs is either a flag change or a compiler change. Recording the
      # compiler is what lets a reader tell those two apart; asserting it here is what stops the pin
      # from silently going stale when the image is updated.
      - name: The job image is the toolchain the release names
        run: |
          set -eu
          got="$(go version | awk '{print $3}')"
          echo "go in job image: ${got} (pinned: ${CI_GO_VERSION}, digest ${CI_IMAGE_DIGEST})"
          [ "${got}" = "${CI_GO_VERSION}" ] || {
            echo "the job image carries ${got}, this workflow pins ${CI_GO_VERSION}." >&2
            echo "A release records the compiler it was built with; update CI_IMAGE_DIGEST and" >&2
            echo "CI_GO_VERSION together, then re-tag, rather than publishing an unlabelled binary." >&2
            exit 1
          }

      - name: Build both architectures, one build date
        run: |
          set -eu
          make dist \
            VERSION="${GITHUB_REF_NAME}" \
            COMMIT="$(git rev-parse --short HEAD)" \
            COMMIT_FULL="$(git rev-parse HEAD)" \
            BUILD_DATE="$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)" \
            CI_IMAGE="${CI_IMAGE}" \
            CI_IMAGE_DIGEST="${CI_IMAGE_DIGEST}"
          cat dist/build-info.txt

      # The image is built and pushed by a different pipeline — a person on the build host, or
      # `scripts/publish-image.sh` — so this job cannot read the digest off its own disk. The registry
      # is the only thing that knows what `<tag>` currently resolves to, so ask it, and hash the
      # manifest it answers with before recording anything.
      #
      # A tag that was never pushed fails here on purpose. The two alternatives are both worse:
      # publishing no digest at all (v0.3.1 and v0.3.2 had to be repaired by hand, t_eda10d6e), or
      # publishing a number nobody can verify. Which also fixes the order of operations: push the
      # image for the tag, then push the tag.
      - name: Record the image digest this tag points at
        env:
          # The container registry is the same endpoint as this Gitea instance and the image is named
          # after the repository path, so both values come from the environment: no address is written
          # into the repository. Set REGISTRY_IMAGE when an image is named differently.
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          host=${GITHUB_SERVER_URL#*://}
          host=${host%/}
          image=${REGISTRY_IMAGE:-${host}/${GITHUB_REPOSITORY}}
          echo "recording the digest ${image}:${GITHUB_REF_NAME} resolves to"
          scripts/record-release-image.sh "${image}" "${GITHUB_REF_NAME}" dist
          cat dist/images.txt

      - name: Publish the Gitea release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          [ -n "${TOKEN}" ] || { echo "the RELEASE_TOKEN secret is not set on this repository" >&2; exit 1; }
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"
          # Re-running a tag must replace the assets, not fail on "already exists" and not leave a
          # second copy of every file.
          if curl -fsS -H "${auth}" "${api}/releases/tags/${GITHUB_REF_NAME}" -o /tmp/rel.json; then
            # `.*` is greedy: on a one-line JSON it matches the LAST "id", which for a
            # release response is an asset id or the author's user id — not the release's.
            # Anchor on the release's own shape ("id":N, immediately followed by "tag_name").
            id=$(sed -n 's/.*"id":\([0-9][0-9]*\),"tag_name".*/\1/p' /tmp/rel.json | head -1)
            echo "release ${GITHUB_REF_NAME} exists (id=${id}); replacing its assets"
            for a in $(curl -fsS -H "${auth}" "${api}/releases/${id}/assets" \
                        | grep -o '"id":[0-9]*' | cut -d: -f2); do
              curl -fsS -X DELETE -H "${auth}" "${api}/releases/assets/${a}" >/dev/null
            done
          else
            rel=$(curl -fsS -X POST -H "${auth}" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"body\":\"See CHANGELOG.md\",\"prerelease\":false}" \
              "${api}/releases")
            # Same greedy-match trap as above; anchor on "id":N,"tag_name".
            id=$(printf '%s' "${rel}" | sed -n 's/.*"id":\([0-9][0-9]*\),"tag_name".*/\1/p')
          fi
          [ -n "${id}" ] || { echo "could not determine the release id" >&2; exit 1; }
          # The release body is replaced by hand with the changelog section; assets are what the
          # pipeline owns.
          for f in dist/*; do
            curl -fsS -X POST -H "${auth}" \
              -F "attachment=@${f}" "${api}/releases/${id}/assets?name=$(basename "${f}")" >/dev/null
            echo "uploaded $(basename "${f}")"
          done
          # The upload loop above cannot tell whether the assets landed on THIS release:
          # a wrong id makes every curl succeed against somebody else's release. Count them.
          uploaded=$(curl -fsS -H "${auth}" "${api}/releases/${id}/assets" | grep -o '"id":[0-9]*' | wc -l)
          want=$(ls -1 dist | wc -l)
          [ "${uploaded}" = "${want}" ] || {
            echo "release ${id} holds ${uploaded} assets, expected ${want} — the id was wrong" >&2
            exit 1
          }

      # Every step above returns 0 whether or not it wrote what it claims, which is the failure shape
      # this pipeline keeps hitting. So read the asset back byte for byte, then ask the registry once
      # more: if the tag moved between recording and publishing, the release now names an image that
      # is no longer behind that tag and the digest is stale even though every upload succeeded.
      - name: The published images.txt is the registry's answer
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          [ -n "${TOKEN}" ] || { echo "the RELEASE_TOKEN secret is not set on this repository" >&2; exit 1; }
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"
          rel=$(curl -fsS -H "${auth}" "${api}/releases/tags/${GITHUB_REF_NAME}")
          # The download URL ends in the file name, so this needs no JSON parser and no field order.
          url=$(printf '%s' "${rel}" \
                  | grep -o '"browser_download_url":"[^"]*/images\.txt"' \
                  | cut -d'"' -f4 || true)
          [ -n "${url}" ] || {
            echo "release ${GITHUB_REF_NAME} has no images.txt asset — the digest step did not take" >&2
            exit 1
          }
          curl -fsS -H "${auth}" "${url}" -o /tmp/images.published.txt
          published_sum=$(sha256sum /tmp/images.published.txt | cut -d' ' -f1)
          local_sum=$(sha256sum dist/images.txt | cut -d' ' -f1)
          [ "${published_sum}" = "${local_sum}" ] || {
            echo "the asset on the release page (${published_sum}) is not the file this job wrote" >&2
            echo "(${local_sum}); somebody else's release may share this tag" >&2
            exit 1
          }
          host=${GITHUB_SERVER_URL#*://}
          host=${host%/}
          image=${REGISTRY_IMAGE:-${host}/${GITHUB_REPOSITORY}}
          scripts/record-release-image.sh "${image}" "${GITHUB_REF_NAME}" /tmp/now >/dev/null
          now=$(sed -n 's/^IMAGE_DIGEST=//p' /tmp/now/images.txt)
          was=$(sed -n 's/^IMAGE_DIGEST=//p' dist/images.txt)
          [ "${now}" = "${was}" ] || {
            echo "${image}:${GITHUB_REF_NAME} resolved to ${was} when recorded and to ${now} now." >&2
            echo "The tag was re-pushed mid-release; the published digest names an image that is no" >&2
            echo "longer behind it. Re-tag rather than publish a digest that already drifted." >&2
            exit 1
          }
          echo "asset == local file (${was} is what ${image}:${GITHUB_REF_NAME} still resolves to)"
