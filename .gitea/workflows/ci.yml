name: ci

# Needs a runner registered with this Gitea instance (label k8s-go, job-pods mode). Until one exists, run
# `make lint test && go test -race ./...` locally — that is exactly what this workflow does.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: k8s-go
    steps:
      # Not actions/checkout: that action is JavaScript, so it needs Node in the job image and a fetch
      # from the action host - this cluster has neither. builtin:checkout is documented but runner
      # v6.0.0 rejects it ("invalid action"), so the lines are written out. sslVerify is off because
      # the instance uses a private CA; a repo secret for the CA is the follow-up that removes it.
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.sslVerify=false -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Format and vet
        run: make fmt vet

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Build
        run: make build

  manifests:
    runs-on: k8s-go
    steps:
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.sslVerify=false -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      # kustomize ships inside the job image: the cluster has no route to github.com releases.
      - name: kustomize is available
        run: kustomize version
      - name: Validate kustomize output
        run: make render

  dco:
    runs-on: k8s-go
    steps:
      - name: Checkout (full history: DCO needs the commit range)
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.sslVerify=false -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch -q origin
          git checkout -q "${GITHUB_SHA}"
      # A commit without a matching Signed-off-by is a contribution whose provenance nobody can answer
      # for later, which is the whole point of DCO. Base is the merge target, not main, so stacked
      # branches are checked over their own range.
      - name: Every commit signed off
        run: |
          set -eu
          base="${GITHUB_BASE_SHA:-${GITHUB_BEFORE:-HEAD~1}}"
          range="$base..HEAD"
          bad=0
          for c in $(git rev-list "$range"); do
            author="$(git log -1 --format='%ae' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -qi "^Signed-off-by: .*<$author>"; then
              echo "missing or mismatched Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          [ "$bad" = 0 ]

  i18n:
    runs-on: k8s-go
    steps:
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.sslVerify=false -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # A translation that is older than the English it claims to translate is worse than no translation:
      # a reader trusts it. Missing translations are only listed, because "not yet" is a plan, not a lie.
      - name: Translations are not stale
        run: ./scripts/check-i18n.sh
