name: ci

# Needs a runner registered with this Gitea instance (act_runner). Until one exists, run
# `make lint test && go test -race ./...` locally — that is exactly what this workflow does.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Format and vet
        run: make fmt vet

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Build
        run: make build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin
      - name: Validate kustomize output
        run: make render

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A commit without a matching Signed-off-by is a contribution whose provenance nobody can answer
      # for later, which is the whole point of DCO. Base is the merge target, not main, so stacked
      # branches are checked over their own range.
      - name: Every commit signed off
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          range="$base..HEAD"
          bad=0
          for c in $(git rev-list "$range"); do
            author="$(git log -1 --format='%ae' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -qi "^Signed-off-by: .*<$author>"; then
              echo "missing or mismatched Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          [ "$bad" = 0 ]
