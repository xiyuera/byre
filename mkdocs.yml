# Documentation site for byre.
#
# The markdown under docs/ is the source of truth and is also browsable on GitHub; this config only
# changes how it is presented. Nothing here duplicates content -- every page is a file that already
# exists in the repository, so a doc fix reaches both the site and the repo at once.
#
# `docs/index.md` is the exception: it is the landing page, written for a first-time visitor, and is
# deliberately narrower than README.md (which stays the front door for people reading on GitHub).

site_name: byre
site_description: >-
  A lease-based SSH gateway for agent sandboxes: the client's public key is the lease, so one agent
  keeps one instance exclusively until the lease expires.
site_url: https://xiyuera.github.io/byre/
repo_url: https://github.com/xiyuera/byre
repo_name: xiyuera/byre
edit_uri: edit/main/docs/
copyright: Apache-2.0 · source available on GitHub

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  # `overrides/` adds the head tags mkdocs-material does not emit: og:*, twitter:*, and the JSON-LD
  # SoftwareApplication block. Everything else in the theme is stock — see assets/stylesheets/extra.css
  # for why the palette is overridden in CSS rather than here.
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Dark is the default: this is infrastructure tooling and the diagrams are authored dark-first.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # Mermaid diagrams. The repository's convention is that every architecture, flow, state or sequence
  # diagram is a mermaid fence rather than ASCII art, so the site has to render them; without this
  # fence config they would appear as raw code blocks.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Rewrites ```mermaid fences into the shape mermaid.js reads (see hooks/mermaid.py for the measurements).
hooks:
  - hooks/mermaid.py

plugins:
  - search
  # One tree, two languages, distinguished by a BCP 47 suffix (`limits.md` / `limits.zh.md`).
  # `suffix` rather than a mirrored `zh/` tree: the same reason docs/i18n.md gives for the
  # repository-level pairs -- a file added on one side has no obvious counterpart to check against.
  #
  # The locale is `zh`, not `zh-CN`: mkdocs-material only ships `partials/languages/zh.html`, and
  # `zh-CN` fails the build at template time with `TemplateNotFound`. `.zh.md` is therefore the
  # suffix the site pairs on, which is *not* the same suffix the repository-level check uses
  # (`.zh-CN.md`, scripts/check-i18n.sh) -- the two are separate mechanisms with separate rules,
  # and both are listed in docs/i18n.md.
  #
  # `fallback_to_default` is what makes a partial translation honest rather than broken: a page
  # with no Chinese version is served in English under /zh/ instead of 404ing.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Getting started: 开始使用
            Quick start: 快速开始
            Choose a backend: 选择 backend
            Kubernetes: Kubernetes
            Handbook: 手册
            Architecture: 架构
            Backends in detail: backend 详解
            Operations: 运维
            Troubleshooting: 排错
            Examples: 示例
            Overview: 总览
            Static endpoints: 静态 endpoints
            Local quickstart: 本机快速开始
            Any image that speaks SSH: 任何会 SSH 的镜像
            Kubernetes starter kit: Kubernetes starter kit
            Docker starter kit: Docker starter kit
            Helm chart: Helm chart
            Why not a jump host: 为什么不是跳板机
            Limits: 限制
            Reference: 参考
            Documentation index: 文档索引
            Decision records: 决策记录
            Integrations: 集成
            Roadmap: 路线图
            Contributing: 参与贡献

# Mermaid is bundled rather than pulled from a CDN: the toolchain already treats every diagram as a
# mermaid fence, and a docs site that goes blank when a CDN is unreachable is worse than a 2.5 MB asset
# that gets cached once. Material detects `window.mermaid` and runs it on every page, including the
# instant-navigation redraws.
# Only the library. Material 9.8 has its own mermaid integration (it watches for `window.mermaid`
# and renders `.mermaid` blocks, including on instant-navigation redraws). An init script of our own
# ran a second render over already-rendered nodes and produced "Syntax error in text" -- measured, not
# guessed. Bundled locally rather than via CDN so the site does not break where a CDN is unreachable.
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xiyuera/byre
  # Shown as a banner above the content on every page.
  generator: false

# Nav is hand-written rather than auto-generated: the order encodes the reading paths in
# docs/README.md ("architecture if you are reading the code, operations if you are running it,
# troubleshooting if it is running and does not work"). Pages that live outside docs_dir -- the
# examples/ and charts/ READMEs -- are linked from the pages instead of listed here, because mkdocs
# cannot include a file from outside docs_dir.
nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started/quickstart.md
      - Choose a backend: getting-started/backends.md
      - Kubernetes: getting-started/kubernetes.md
  - Handbook:
      - Architecture: handbook/architecture.md
      - Backends in detail: handbook/backends.md
      - Operations: handbook/operations.md
      - Troubleshooting: handbook/troubleshooting.md
  - Examples:
      - Overview: examples/index.md
      - Static endpoints: examples/static-endpoints.md
      - Local quickstart: examples/local-quickstart.md
      - Any image that speaks SSH: examples/pod-image.md
      - Kubernetes starter kit: examples/kubernetes-sandbox.md
      - Docker starter kit: examples/docker-sandbox.md
      - Helm chart: examples/helm-chart.md
  - Why not a jump host: why-not-a-jump-host.md
  - Limits: limits.md
  - Reference:
      - Documentation index: documentation-index.md
      - Decision records: adr/index.md
      - Integrations: integrations/README.md
      - Roadmap: roadmap.md
  - Contributing: contributing.md
