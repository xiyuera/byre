{{- /*
The pool key: prefer an existing secret. When neither is given, render an empty one so the
release installs and the pod starts -- `byre` validates that `ssh.private_key` is a path, not
that the file exists, so a missing key surfaces as a clear "read key" error on the first
connection rather than as a CrashLoop. NOTES.txt says so too.

An inline privateKey is a release value and lands in Helm's release secret: acceptable for a
lab, not for anything shared.
*/}}
{{- if not .Values.poolKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "byre.poolKeySecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "byre.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.poolKey.secretKey }}: |
    {{- .Values.poolKey.privateKey | default "" | nindent 4 }}
{{- end }}
